version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: aisoc-postgres
    restart: always
    environment:
      POSTGRES_DB: aisoc
      POSTGRES_USER: aisoc
      POSTGRES_PASSWORD: aisoc_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisoc -d aisoc"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aisoc-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://aisoc:aisoc_secure_password@db:5432/aisoc
      - FALCON_MOCK=${FALCON_MOCK:-true}
      - FALCON_CLIENT_ID=${FALCON_CLIENT_ID:-}
      - FALCON_CLIENT_SECRET=${FALCON_CLIENT_SECRET:-}
      - FALCON_CLOUD=${FALCON_CLOUD:-us1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CORS_ORIGINS=["http://localhost:3000"]
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aisoc-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:

